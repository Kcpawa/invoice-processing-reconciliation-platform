openapi: 3.0.3
info:
  title: Invoice Platform - Master Data API (Django REST Framework)
  version: 1.0.0
  description: CRUD for vendors, purchase orders and invoices. Bulk upload, reconciliation
    and reports are served by the FastAPI service.
paths:
  /api/v1/invoices/:
    get:
      operationId: v1_invoices_list
      description: |-
        Vendor invoices.

        New invoices start as PENDING and are classified by the reconciliation
        engine (FastAPI service: `POST /api/v1/reconciliation/run`).

        Editing a reconciliation-relevant field resets the invoice to PENDING;
        if it was MATCHED, the PO balance it consumed is released. Deleting a
        MATCHED invoice releases its balance too.
      parameters:
      - in: query
        name: due_date_from
        schema:
          type: string
          format: date
      - in: query
        name: due_date_to
        schema:
          type: string
          format: date
      - in: query
        name: invoice_date_from
        schema:
          type: string
          format: date
      - in: query
        name: invoice_date_to
        schema:
          type: string
          format: date
      - in: query
        name: invoice_number
        schema:
          type: string
      - in: query
        name: max_total
        schema:
          type: number
      - in: query
        name: min_total
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: po_number
        schema:
          type: string
      - in: query
        name: purchase_order
        schema:
          type: number
      - in: query
        name: reconciliation_status
        schema:
          type: string
          enum:
          - FAILED
          - MATCHED
          - MISMATCHED
          - PENDING
        description: |-
          * `PENDING` - Pending
          * `MATCHED` - Matched
          * `MISMATCHED` - Mismatched
          * `FAILED` - Failed
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
          enum:
          - API
          - BULK_UPLOAD
        description: |-
          * `API` - Api
          * `BULK_UPLOAD` - Bulk Upload
      - in: query
        name: vendor
        schema:
          type: number
      - in: query
        name: vendor_code
        schema:
          type: string
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoiceList'
          description: ''
    post:
      operationId: v1_invoices_create
      description: |-
        Vendor invoices.

        New invoices start as PENDING and are classified by the reconciliation
        engine (FastAPI service: `POST /api/v1/reconciliation/run`).

        Editing a reconciliation-relevant field resets the invoice to PENDING;
        if it was MATCHED, the PO balance it consumed is released. Deleting a
        MATCHED invoice releases its balance too.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
  /api/v1/invoices/{id}/:
    get:
      operationId: v1_invoices_retrieve
      description: |-
        Vendor invoices.

        New invoices start as PENDING and are classified by the reconciliation
        engine (FastAPI service: `POST /api/v1/reconciliation/run`).

        Editing a reconciliation-relevant field resets the invoice to PENDING;
        if it was MATCHED, the PO balance it consumed is released. Deleting a
        MATCHED invoice releases its balance too.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this invoice.
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
    put:
      operationId: v1_invoices_update
      description: |-
        Vendor invoices.

        New invoices start as PENDING and are classified by the reconciliation
        engine (FastAPI service: `POST /api/v1/reconciliation/run`).

        Editing a reconciliation-relevant field resets the invoice to PENDING;
        if it was MATCHED, the PO balance it consumed is released. Deleting a
        MATCHED invoice releases its balance too.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this invoice.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
    patch:
      operationId: v1_invoices_partial_update
      description: |-
        Vendor invoices.

        New invoices start as PENDING and are classified by the reconciliation
        engine (FastAPI service: `POST /api/v1/reconciliation/run`).

        Editing a reconciliation-relevant field resets the invoice to PENDING;
        if it was MATCHED, the PO balance it consumed is released. Deleting a
        MATCHED invoice releases its balance too.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this invoice.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInvoiceRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
    delete:
      operationId: v1_invoices_destroy
      description: |-
        Vendor invoices.

        New invoices start as PENDING and are classified by the reconciliation
        engine (FastAPI service: `POST /api/v1/reconciliation/run`).

        Editing a reconciliation-relevant field resets the invoice to PENDING;
        if it was MATCHED, the PO balance it consumed is released. Deleting a
        MATCHED invoice releases its balance too.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this invoice.
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/purchase-orders/:
    get:
      operationId: v1_purchase_orders_list
      description: |-
        Purchase orders.

        `total_amount` and `remaining_balance` are maintained by the system:
        total = amount + tax, and the balance is reduced when an invoice is
        reconciled as MATCHED. A PO referenced by invoices cannot be deleted (409).
      parameters:
      - in: query
        name: max_remaining_balance
        schema:
          type: number
      - in: query
        name: min_remaining_balance
        schema:
          type: number
      - in: query
        name: order_date_from
        schema:
          type: string
          format: date
      - in: query
        name: order_date_to
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: po_number
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - CLOSED
          - OPEN
        description: |-
          * `OPEN` - Open
          * `CLOSED` - Closed
          * `CANCELLED` - Cancelled
      - in: query
        name: vendor
        schema:
          type: number
      - in: query
        name: vendor_code
        schema:
          type: string
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPurchaseOrderList'
          description: ''
    post:
      operationId: v1_purchase_orders_create
      description: |-
        Purchase orders.

        `total_amount` and `remaining_balance` are maintained by the system:
        total = amount + tax, and the balance is reduced when an invoice is
        reconciled as MATCHED. A PO referenced by invoices cannot be deleted (409).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
          description: ''

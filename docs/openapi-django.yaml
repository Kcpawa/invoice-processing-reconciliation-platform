components:
  schemas:
    Invoice:
      type: object
      description: |-
        `total_amount` is optional on input: it is derived as amount + tax, and
        rejected if a supplied value disagrees.

        Whether the invoice agrees with its PO (vendor match, available balance)
        is deliberately *not* validated here - that is the reconciliation
        engine's job, and such invoices are stored and classified MISMATCHED.
      properties:
        id:
          type: integer
          readOnly: true
        invoice_number:
          type: string
          maxLength: 50
        vendor:
          type: integer
        vendor_code:
          type: string
          readOnly: true
        purchase_order:
          type: integer
        po_number:
          type: string
          readOnly: true
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        tax_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        reconciliation_status:
          allOf:
          - $ref: '#/components/schemas/ReconciliationStatusEnum'
          readOnly: true
        reconciliation_notes:
          readOnly: true
          description: List of {code, message} reasons from the last reconciliation
            run.
        reconciled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - due_date
      - id
      - invoice_date
      - invoice_number
      - po_number
      - purchase_order
      - reconciled_at
      - reconciliation_notes
      - reconciliation_status
      - source
      - updated_at
      - vendor
      - vendor_code
    InvoiceRequest:
      type: object
      description: |-
        `total_amount` is optional on input: it is derived as amount + tax, and
        rejected if a supplied value disagrees.

        Whether the invoice agrees with its PO (vendor match, available balance)
        is deliberately *not* validated here - that is the reconciliation
        engine's job, and such invoices are stored and classified MISMATCHED.
      properties:
        invoice_number:
          type: string
          minLength: 1
          maxLength: 50
        vendor:
          type: integer
        purchase_order:
          type: integer
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        tax_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - amount
      - due_date
      - invoice_date
      - invoice_number
      - purchase_order
      - vendor
    PaginatedInvoiceList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total_pages:
          type: integer
          example: 7
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
    PaginatedPurchaseOrderList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total_pages:
          type: integer
          example: 7
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrder'
    PaginatedVendorList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total_pages:
          type: integer
          example: 7
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Vendor'
    PatchedInvoiceRequest:
      type: object
      description: |-
        `total_amount` is optional on input: it is derived as amount + tax, and
        rejected if a supplied value disagrees.

        Whether the invoice agrees with its PO (vendor match, available balance)
        is deliberately *not* validated here - that is the reconciliation
        engine's job, and such invoices are stored and classified MISMATCHED.
      properties:
        invoice_number:
          type: string
          minLength: 1
          maxLength: 50
        vendor:
          type: integer
        purchase_order:
          type: integer
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        tax_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
    PatchedPurchaseOrderRequest:
      type: object
      properties:
        po_number:
          type: string
          minLength: 1
          maxLength: 50
        vendor:
          type: integer
        description:
          type: string
          maxLength: 500
        order_date:
          type: string
          format: date
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        tax_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/PurchaseOrderStatusEnum'

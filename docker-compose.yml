# Database only:      docker compose up -d db
# Whole platform:     docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoice_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoice_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  django:
    build: .
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py seed_demo_data &&
             python manage.py runserver 0.0.0.0:8000"
    environment: &app-env
      DB_NAME: invoice_platform
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  fastapi:
    build: .
    command: uvicorn fastapi_app.main:app --host 0.0.0.0 --port 8001
    environment: *app-env
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_started

volumes:
  pgdata:
